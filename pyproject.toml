[project]
name = "license-cost-sweep"
version = "0.1.0"
description = "Finds wasted licence spend, including disabled accounts with paid licences, shared mailboxes with unnecessary licences, and licensed users that have never logged in."
readme = "README.md"
authors = [
    { name = "Anuk", email = "anukd@mspblueshift.com.au" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
license-cost-sweep = "license_cost_sweep:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
